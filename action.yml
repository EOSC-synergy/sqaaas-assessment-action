name: 'SQAaaS source code assessment'
description: 'Trigger the source code assessment in SQAaaS'
author: 'Pablo Orviz <orviz@ifca.unican.es>'
branding:
  icon: "award"
  color: "orange"
inputs:
  repo:
    description: URL of the repository to assess (defaults to current repo)
    required: false
  branch:
    description: Branch of the repository (defaults to branch that triggered the build)
    required: false
  qc_uni_steps:
    description: space-separated list of steps for unit testing (QC.Uni) quality criterion (composed with sqaaas-step-action)
    required: false
  credentials:
    description: JSON dict that contains username and password/token for evaluating private rpositories
  criteria_workflow_only:
    description: true or false depending on whether you only want to trigger specified criteria workflow
    required: false
  explicit_criteria_workflow: 
    description: use this to specify a payload  

outputs:
  report:
    description: 'JSON payload containing the full QA report'
runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.repo }}
    - ${{ inputs.branch }}
    - ${{ inputs.qc_uni_steps }}
    - ${{ inputs.credentials_id}}
    - ${{ inputs.criteria_workflow_only}}
    - ${{ inputs.explicit_criteria_workflow}}
